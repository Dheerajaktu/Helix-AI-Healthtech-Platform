spring:
  application:
    name: Helix-AI-Health-Platform

  datasource:
    url: jdbc:postgresql://localhost:5432/pg_helix_dev_db
    username: pgroot
    password: Root.pg@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# =========================================
# LOGGING
# =========================================
logging:
  level:
    root: INFO
    com.healthcare.helix: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: 4001

# =========================================
# JWT Config
# =========================================
jwt:
  secret: ${JWT_SECRET:this-is-a-temporary-dev-secret-key-must-be-at-least-64-bytes-long-for-hs512-algorithm}
  access-token-expiration: 900000       # 15 minutes in ms
  refresh-token-expiration: 2592000000  # 30 days in ms


cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket-name: helix-health-documents

# =========================================
# SMTP MAIL
# =========================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# =========================================
# KAFKA CONFIG
# =========================================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: email-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.healthcare.helix"